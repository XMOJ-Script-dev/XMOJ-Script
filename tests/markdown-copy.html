<!doctype html>
<meta charset="utf-8">
<title>Markdown copy regression tests</title>
<pre id="results">Running…</pre>
<script>
(async () => {
    // Also runs automatically through tests/markdown-copy.test.cjs.
    let source;
    let GetMDText;
    let GetProblemSectionMarkdown;
    let GetProblemStatementMarkdown;
    let InitializeProblemMarkdownCopy;
    const results = [];
    const fixture = document.createElement('div');
    document.body.appendChild(fixture);

    function Check(name, html, expected, setup = () => {}, trim = true, read = GetMDText) {
        fixture.innerHTML = html;
        delete window.MathJax;
        setup(fixture);
        const before = fixture.innerHTML;
        const copied = read(fixture);
        const actual = trim ? copied.trim() : copied;
        if (actual !== expected) throw new Error(name + ': expected ' + JSON.stringify(expected) + ', got ' + JSON.stringify(actual));
        if (fixture.innerHTML !== before) throw new Error(name + ': changed the page DOM');
        results.push(name);
    }

    function Katex(tex) {
        // KaTeX's default output includes both MathML and the visual HTML tree.
        return '<span class="katex"><span class="katex-mathml"><math><semantics><mrow><mi>visual</mi></mrow>' +
            '<annotation encoding="application/x-tex">' + tex + '</annotation></semantics></math></span>' +
            '<span class="katex-html" aria-hidden="true"><span class="base">duplicate</span></span></span>';
    }

    try {
        const response = await fetch('../XMOJ.user.js');
        if (!response.ok) throw new Error('Cannot load XMOJ.user.js: HTTP ' + response.status);
        source = await response.text();
        const anchor = 'function GetMDText(';
        const start = source.indexOf(anchor);
        const end = source.indexOf('\nfunction InitializeImageEnlarger(', start);
        if (start < 0 || source.indexOf(anchor, start + anchor.length) !== -1 || end <= start) {
            throw new Error('Cannot locate a unique GetMDText function and its InitializeImageEnlarger boundary in XMOJ.user.js');
        }
        ({GetMDText, GetProblemSectionMarkdown, GetProblemStatementMarkdown, InitializeProblemMarkdownCopy} =
            new Function(source.slice(start, end) +
                '\nreturn {GetMDText, GetProblemSectionMarkdown, GetProblemStatementMarkdown, InitializeProblemMarkdownCopy};')());
        Check('paragraphs and nested containers', '<div><p>First <span>paragraph</span>.</p><div><p>Second.</p></div></div>',
            'First paragraph.\n\nSecond.');
        Check('explicit Markdown hard breaks', '<p>First<br>Second<br><br>Fourth</p><p>Next.</p>',
            'First  \nSecond  \n  \nFourth\n\nNext.');
        Check('inline KaTeX source appears once', '<p>区间 ' + Katex('[a_i,b_i]') + ' 满足 ' + Katex('b_{i-1}&lt;a_i\\le b_i') + '。</p>',
            '区间 $[a_i,b_i]$ 满足 $b_{i-1}<a_i\\le b_i$。');
        Check('display KaTeX keeps its delimiters and paragraphs', '<p>Before.</p><span class="katex-display">' +
            Katex('\\sum_{i=1}^{N} a_i') + '</span><p>After.</p>',
            'Before.\n\n$$\n\\sum_{i=1}^{N} a_i\n$$\n\nAfter.');
        Check('standalone MathML TeX annotation', '<math display="block"><semantics><mi>x</mi>' +
            '<annotation encoding="application/x-tex">x^2</annotation></semantics></math>', '$$\nx^2\n$$');
        Check('MathJax source and display mode', '<p>Value <mjx-container>visual</mjx-container>.</p>' +
            '<mjx-container display="true">duplicate</mjx-container><p>Next.</p>',
            'Value $a_i$.\n\n$$\na_i \\le b_i\n$$\n\nNext.', root => {
                const nodes = root.querySelectorAll('mjx-container');
                window.MathJax = {startup: {document: {getMathItemsWithin(elements) {
                    if (elements.length !== 1 || elements[0] !== root) throw new Error('Wrong MathJax container');
                    return [
                        {typesetRoot: nodes[0], math: 'a_i', display: false},
                        {typesetRoot: nodes[1], math: 'a_i \\le b_i', display: true}
                    ];
                }}}};
            });
        Check('MathJax 3.0 expression list fallback', '<p>Value <mjx-container>visual</mjx-container>.</p>',
            'Value $a_i$.', root => {
                window.MathJax = {startup: {document: {math: [
                    {typesetRoot: root.querySelector('mjx-container'), math: 'a_i', display: false},
                    {typesetRoot: document.createElement('mjx-container'), math: 'outside', display: true}
                ]}}};
            });
        Check('raw TeX remains available before typesetting', '<p>Value $a_i$.</p><p>$$x^2$$</p>', 'Value $a_i$.\n\n$$x^2$$');
        Check('preformatted edge whitespace and breaks', '<pre>  first\n\n    second<br>third  </pre>',
            '  first\n\n    second\nthird  \n\n', () => {}, false);
        Check('relative images and table cells', '<p>Image <img src="../Images/1.png"></p><table><tr><td>A</td><td>B</td></tr>' +
            '<tr><td>C</td><td>D</td></tr></table>', 'Image ![](' + new URL('../Images/1.png', location.href).href + ')\n\nA\tB\t\nC\tD');
        Check('indented table cells retain columns', '<table>\n <tr>\n <th>\n  A\n </th>\n <th>B</th>\n </tr>\n' +
            '<tr>\n <td> C </td>\n <td> D </td>\n </tr>\n</table>', 'A\tB\t\nC\tD');
        Check('nested table cell paragraphs retain separation', '<table><tr><td><div><p>A</p><p>B</p></div></td>' +
            '<td><p>C</p>D<div>E</div>F</td></tr></table>', 'A\nB\tC\nD\nE\nF');
        Check('empty table cells retain columns', '<table><tr><td></td><td>A</td><td> </td><td>B</td></tr></table>',
            '\tA\t\tB\t\n\n', () => {}, false);
        Check('table cell preformatted whitespace is retained', '<table><tr><td><pre>  A\n\n B  </pre></td>' +
            '<td>C</td></tr></table>', '  A\n\n B  \tC\t\n\n', () => {}, false);
        Check('formatted HTML block boundaries', '\n  <p>A</p>\n  <p>B</p>\n  ', 'A\n\nB');
        Check('inline whitespace is retained', '<p><span>A</span> <span>B</span>&nbsp;C</p>', 'A B\u00a0C');
        Check('list item line separation', '<ul>\n  <li>A</li>\n  <li>B</li>\n</ul>', 'A\n\nB');
        Check('KaTeX display math stays within table cells', '<table><tr><td>a</td><td><span class="katex-display">' +
            Katex('x') + '</span></td><td>b</td></tr><tr><td>c</td><td>d</td><td>e</td></tr></table>',
            'a\t$$x$$\tb\t\nc\td\te');
        Check('MathJax display math stays within table cells', '<table><tr><td>a</td><td><mjx-container>visual</mjx-container>' +
            '</td><td>b</td></tr></table>', 'a\t$$x$$\tb', root => {
                window.MathJax = {startup: {document: {math: [
                    {typesetRoot: root.querySelector('mjx-container'), math: 'x', display: true}
                ]}}};
            });

        const fence = '\x60\x60\x60';
        const Section = (heading, content) => '<div class="cnt-row"><div class="cnt-row-head">' + heading +
            '</div><div class="cnt-row-body">' + content + '</div></div>';
        const sampleBody = '<div class="data-sample"><div class="in-out">' +
            '<div class="in-out-item"><span class="title">样例输入 #1</span><a class="copy-btn">复制</a>' +
            '<pre class="content"><span class="sampledata">  1\n2 </span></pre></div>' +
            '<div class="in-out-item"><span class="title">样例输出 #1</span><a class="copy-btn">复制成功</a>' +
            '<pre class="content"><span class="sampledata">3</span></pre></div></div>' +
            '<div><div class="title">样例说明 #1</div><div class="content"><p>Sum $a+b$.</p></div></div></div>';
        const sampleMarkdown = '## 样例输入输出\n\n### 样例输入 #1\n\n' + fence + 'plain\n  1\n2 \n' + fence +
            '\n\n### 样例输出 #1\n\n' + fence + 'plain\n3\n' + fence + '\n\n### 样例说明 #1\n\nSum $a+b$.';
        Check('sample sections include headings and fenced data', Section('样例输入输出', sampleBody),
            sampleMarkdown, () => {}, true, root => GetProblemSectionMarkdown(root.firstElementChild));
        Check('wrapped sample sections retain headings and fenced data',
            Section('样例输入输出', '<div class="content"><div class="content">' + sampleBody + '</div></div>'),
            sampleMarkdown, () => {}, true, root => GetProblemSectionMarkdown(root.firstElementChild));
        Check('subsection copy includes its heading', Section('题目描述<button>复制成功</button>',
            '<div class="content"><p>A</p>\n<p>B</p></div>'), '## 题目描述\n\nA\n\nB',
            () => {}, true, root => GetProblemSectionMarkdown(root.firstElementChild));
        const statement = '<div class="xmoj-problem-head"><h2>问题 A: Zoo<small data-xmoj-script="problem-id"> (1000)</small>' +
            '<button data-xmoj-script="copy-problem">复制</button></h2></div><div class="xmoj-problem-body">' +
            Section('题目描述', '<div class="content"><p>A</p>\n<p>B</p></div>') +
            Section('输出', '<div class="content"></div>') + Section('样例输入输出', sampleBody) +
            Section('数据范围', '<div class="content">1 ≤ N ≤ 10</div>') + '</div>' +
            Section('导出', '<div class="content">Export tools</div>');
        const statementMarkdown = '# Zoo\n\n## 题目描述\n\nA\n\nB\n\n' + sampleMarkdown + '\n\n## 数据范围\n\n1 ≤ N ≤ 10';
        Check('full statement omits absent sections and export tools', statement, statementMarkdown,
            () => {}, true, root => GetProblemStatementMarkdown(root));
        const classic = '<center><h2 class="lang_cn">问题 1000: Graph: Paths</h2>' +
            '<h2 class="lang_en" style="display:none">Problem 1000: Graph: English</h2></center>' +
            Section('<span class="lang_cn">题目描述</span><span class="lang_en">Description</span>',
                '<div class="content lang_cn"><p>A</p>\n<p>B</p></div><div class="content lang_en" style="display:none"><p>English.</p></div>') +
            Section('样例输入输出', '<div class="content"><div class="in-out"><div class="in-out-item"><span class="title">样例输入</span>' +
                '<pre class="content"><span class="sampledata">x</span></pre></div></div></div>');
        Check('classic statement selects Chinese content and numbers samples', classic,
            '# Graph: Paths\n\n## 题目描述\n\nA\n\nB\n\n## 样例输入输出\n\n### 样例输入 #1\n\n' + fence + 'plain\nx\n' + fence,
            () => {}, true, root => GetProblemStatementMarkdown(root));
        const classicFullEnglish = '# Graph: English\n\n## Description\n\nEnglish.\n\n## 样例输入输出\n\n### 样例输入 #1\n\n' + fence + 'plain\nx\n' + fence;
        Check('classic statement selects English content', classic, classicFullEnglish,
            () => {}, true, root => GetProblemStatementMarkdown(root, 'en'));
        Check('sample code uses a fence longer than its backticks', Section('样例输入输出',
            '<div class="in-out"><div class="in-out-item"><span class="title">Input #1</span><pre class="content">' +
            '<span class="sampledata">' + fence + '</span></pre></div></div>'),
            '## 样例输入输出\n\n### Input #1\n\n' + fence + '\x60plain\n' + fence + '\n' + fence + '\x60',
            () => {}, true, root => GetProblemSectionMarkdown(root.firstElementChild));
        Check('explanation-only samples remain copyable', Section('样例输入输出', '<div class="data-sample">' +
            '<div><div class="title">样例说明 #2</div><div class="content">Explanation.</div></div></div>'),
            '## 样例输入输出\n\n### 样例说明 #2\n\nExplanation.', () => {}, true,
            root => GetProblemSectionMarkdown(root.firstElementChild));

        // Exercise the actual clipboard callbacks and their idempotent control setup.
        for (const [name, html, expected, sampleExpected] of [
            ['new UI copy controls', statement, statementMarkdown, sampleMarkdown],
            ['classic copy controls', classic,
                '# Graph: Paths\n\n## 题目描述\n\nA\n\nB\n\n## 样例输入输出\n\n### 样例输入 #1\n\n' + fence + 'plain\nx\n' + fence,
                '## 样例输入输出\n\n### 样例输入 #1\n\n' + fence + 'plain\nx\n' + fence]
        ]) {
            fixture.innerHTML = html;
            for (const button of fixture.querySelectorAll('[data-xmoj-script="copy-problem"]')) button.remove();
            const original = fixture.cloneNode(true);
            const before = original.innerHTML;
            let copied;
            window.GM_setClipboard = text => { copied = text; };
            InitializeProblemMarkdownCopy(fixture, original);
            const count = fixture.querySelectorAll('[data-xmoj-script="copy-section"]').length;
            InitializeProblemMarkdownCopy(fixture, original);
            if (fixture.querySelectorAll('[data-xmoj-script="copy-section"]').length !== count) throw new Error(name + ': duplicate buttons');
            fixture.querySelector('[data-xmoj-script="copy-problem"]').click();
            if (copied !== expected) throw new Error(name + ': wrong full statement: ' + JSON.stringify(copied));
            const buttons = fixture.querySelectorAll('.cnt-row-head [data-xmoj-script="copy-section"]');
            buttons[0].click();
            if (!copied.startsWith('## ') || !copied.includes('A\n\nB')) throw new Error(name + ': paragraph breaks or heading missing');
            buttons[buttons.length - (name.startsWith('new') ? 2 : 1)].click();
            if (copied !== sampleExpected) throw new Error(name + ': wrong samples: ' + JSON.stringify(copied));
            if (name === 'classic copy controls') {
                // Switch only the live DOM: the detached source still has English hidden.
                for (const node of fixture.querySelectorAll('.lang_cn')) node.style.display = 'none';
                for (const node of fixture.querySelectorAll('.lang_en')) node.style.display = '';
                fixture.querySelector('h2.lang_en [data-xmoj-script="copy-problem"]').click();
                if (copied !== classicFullEnglish) throw new Error(name + ': full copy did not follow English visibility: ' + JSON.stringify(copied));
                buttons[0].click();
                if (copied !== '## Description\n\nEnglish.') throw new Error(name + ': section copy did not follow English visibility');
                for (const node of fixture.querySelectorAll('.lang_en')) node.style.display = 'none';
                for (const node of fixture.querySelectorAll('.lang_cn')) node.style.display = '';
                fixture.querySelector('h2.lang_cn [data-xmoj-script="copy-problem"]').click();
                if (copied !== expected) throw new Error(name + ': full copy did not switch back to Chinese');
                buttons[0].click();
                if (copied !== '## 题目描述\n\nA\n\nB') throw new Error(name + ': section copy did not switch back to Chinese');
                results.push('classic copy controls follow displayed language');
            }
            if (original.innerHTML !== before) throw new Error(name + ': changed the source DOM');
            delete window.GM_setClipboard;
            results.push(name);
        }

        window.markdownCopyResults = {passed: results.length, tests: results};
        document.getElementById('results').textContent = results.map(name => 'PASS ' + name).join('\n');
    } catch (error) {
        window.markdownCopyResults = {error: error.message, passed: results.length};
        document.getElementById('results').textContent = error.stack;
        throw error;
    } finally {
        fixture.remove();
        delete window.MathJax;
    }
})();
</script>
