name: UpdateToRelease
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - edited
    branches:
      - master
jobs:
  UpdateToRelease:
    runs-on: ubuntu-latest
    # 添加条件：如果是 bot 触发的则跳过，避免无限循环
    if: github.event.pull_request.user.login != 'github-actions[bot]'
    permissions:
      pull-requests: write
      contents: write
    steps:
      # 用 GitHub App 的 token 创建版本 PR，这样它的工作流无需手动批准就能运行并自动合并
      - name: Generate a token
        id: generate_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.generate_token.outputs.token }}
      - name: Update to release
        run: |
          if [[ ${{ github.event.pull_request.head.ref }} != dev && $(git diff --name-only HEAD HEAD~1) == *XMOJ.user.js* ]]; then
            echo Closing PR
            gh pr comment ${{ github.event.pull_request.number }} --body "请向\`dev\`分支提交pull request, 本pull request将被自动关闭"
            gh pr close ${{ github.event.pull_request.number }}
          else
            node ./Update/UpdateToRelease.js ${{ steps.generate_token.outputs.token }} ${{ github.event.pull_request.number }} "$PR_BODY"
          fi
        env:
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
