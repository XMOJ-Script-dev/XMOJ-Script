name: Test
on:
  pull_request:
  push:
    branches:
      - dev
      - master
jobs:
  Test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
